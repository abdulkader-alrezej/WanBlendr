<style>
.tools-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.card{background:var(--bg-surface);border:1px solid var(--clr-gray-400);border-radius:8px;padding:12px;box-shadow:var(--shadow-sm)}
.intro-card{margin-bottom:12px}
.card > * + *{margin-top:8px}
.card h2{margin:0 0 6px 0;color:var(--text-color-heading);font-size:1.05rem}
.card p{margin:0 0 8px 0;opacity:.85;font-size:.9rem}
.card h3{margin:0 0 6px 0;color:var(--text-color-heading);font-size:1rem}
.row{display:grid;grid-template-columns:2fr 1fr;gap:6px}
.row-3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px}
label{display:block;margin-bottom:3px;color:var(--text-color);font-size:.85rem}
input,select,textarea{width:100%;padding:.4rem .5rem;background:var(--bg-elevated);color:var(--text-color);border:1px solid var(--clr-gray-400);border-radius:8px;font-size:.85rem}
textarea{min-height:120px;max-height:260px;white-space:pre;overflow:auto;line-height:1.25;margin-top:6px}
.actions{display:flex;gap:6px;margin-top:6px;justify-content:flex-start}
.btn{display:inline-flex;align-items:center;justify-content:center;border:none;padding:.4rem .7rem;cursor:pointer;border-radius:8px;font:inherit;line-height:1.2;background-size:200% 200%;transition:background-position .2s,transform .02s}
.btn:active{transform:scale(.98)}
.run{background-image:var(--gradient-primary);color:#fff}
.run:hover{background-position:right center}
.clear{background:var(--bg-elevated);color:var(--text-color-heading);border:1px solid var(--clr-gray-400)}
.clear:hover{filter:brightness(1.05)}
.error{color:var(--clr-danger);margin:4px 0}
.ok{color:var(--clr-success);margin:4px 0}
#progressBar{display:none;position:fixed;z-index:10000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.45)}
#progressBar .spinner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:8px solid #f3f3f3;border-top:8px solid var(--clr-primary,#655be6);border-radius:50%;width:60px;height:60px;animation:spin 1s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
<div class="card intro-card">
  <h2>IP Tools</h2>
  <p>Ping / DNS / Traceroute / TCP Check</p>
</div>
<div class="tools-wrap">
  <div class="card">
    <h3>Ping</h3>
    <div class="row-3">
      <div>
        <label>Host / IP</label>
        <input id="pingHost" placeholder="8.8.8.8 or example.com">
      </div>
      <div>
        <label>Count</label>
        <input id="pingCount" type="number" value="4" min="1" max="10">
      </div>
      <div>
        <label>Payload size (bytes)</label>
        <input id="pingSize" type="number" value="0" min="0" max="1500">
      </div>
    </div>
    <div class="actions">
      <button class="btn run" id="btnPing">Run Ping</button>
      <button class="btn clear" onclick="$('#pingOut').value='';$('#pingMsg').textContent=''">Clear</button>
    </div>
    <div id="pingMsg"></div>
    <textarea id="pingOut" readonly></textarea>
  </div>
  <div class="card">
    <h3>DNS Lookup</h3>
    <div class="row">
      <div>
        <label>Domain / Host</label>
        <input id="dnsHost" placeholder="example.com">
      </div>
      <div>
        <label>&nbsp;</label>
        <button class="btn run" id="btnDns" style="width:100%">Resolve</button>
      </div>
    </div>
    <div id="dnsMsg"></div>
    <textarea id="dnsOut" readonly></textarea>
  </div>
  <div class="card">
    <h3>Traceroute</h3>
    <div class="row">
      <div>
        <label>Host / IP</label>
        <input id="trHost" placeholder="8.8.8.8">
      </div>
      <div>
        <label>Max hops</label>
        <input id="trHops" type="number" value="30" min="1" max="64">
      </div>
    </div>
    <div class="actions">
      <button class="btn run" id="btnTr">Run Traceroute</button>
      <button class="btn clear" onclick="$('#trOut').value='';$('#trMsg').textContent=''">Clear</button>
    </div>
    <div id="trMsg"></div>
    <textarea id="trOut" readonly></textarea>
  </div>
  <div class="card">
    <h3>TCP Port Check</h3>
    <div class="row">
      <div>
        <label>Host / IP</label>
        <input id="tcpHost" placeholder="1.1.1.1">
      </div>
      <div>
        <label>Port</label>
        <input id="tcpPort" type="number" value="443" min="1" max="65535">
      </div>
    </div>
    <div class="actions">
      <button class="btn run" id="btnTcp">Check Port</button>
      <button class="btn clear" onclick="$('#tcpOut').value='';$('#tcpMsg').textContent=''">Clear</button>
    </div>
    <div id="tcpMsg"></div>
    <textarea id="tcpOut" readonly></textarea>
  </div>
</div>
<div id="progressBar"><div class="spinner"></div></div>
<script>
const PING_URL = '/dashboard/iptools/ping';
const DNS_URL  = '/dashboard/iptools/dns';
const TR_URL   = '/dashboard/iptools/traceroute';
const TCP_URL  = '/dashboard/iptools/tcp_check';
function $(sel){ return document.querySelector(sel); }
function showMsg(el, ok, txt){
  el.className = ok ? 'ok' : 'error';
  el.textContent = txt || '';
}
function toggleOverlay(on){ document.getElementById('progressBar').style.display = on ? 'block' : 'none'; }
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('btnPing').addEventListener('click', async ()=>{
    showMsg($('#pingMsg'), true, ''); toggleOverlay(true);
    try{
      const body = {
        host: $('#pingHost').value.trim(),
        count: parseInt($('#pingCount').value||'4',10),
        size: parseInt($('#pingSize').value||'0',10)
      };
      const r = await fetch(PING_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
      const j = await r.json();
      showMsg($('#pingMsg'), !!j.ok, j.ok ? 'Done' : (j.error||'Failed'));
      $('#pingOut').value = (j.output||'');
    }catch(e){
      showMsg($('#pingMsg'), false, 'Unexpected error');
    }finally{ toggleOverlay(false); }
  });
  document.getElementById('btnDns').addEventListener('click', async ()=>{
    showMsg($('#dnsMsg'), true, ''); toggleOverlay(true);
    try{
      const body = { host: $('#dnsHost').value.trim() };
      const r = await fetch(DNS_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
      const j = await r.json();
      showMsg($('#dnsMsg'), !!j.ok, j.ok ? 'Done' : (j.error||'Failed'));
      $('#dnsOut').value = (j.output||'');
    }catch(e){
      showMsg($('#dnsMsg'), false, 'Unexpected error');
    }finally{ toggleOverlay(false); }
  });
  document.getElementById('btnTr').addEventListener('click', async ()=>{
    showMsg($('#trMsg'), true, ''); toggleOverlay(true);
    try{
      const body = {
        host: $('#trHost').value.trim(),
        max_hops: parseInt($('#trHops').value||'30',10)
      };
      const r = await fetch(TR_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
      const j = await r.json();
      showMsg($('#trMsg'), !!j.ok, j.ok ? 'Done' : (j.error||'Failed'));
      $('#trOut').value = (j.output||'');
    }catch(e){
      showMsg($('#trMsg'), false, 'Unexpected error');
    }finally{ toggleOverlay(false); }
  });
  document.getElementById('btnTcp').addEventListener('click', async ()=>{
    showMsg($('#tcpMsg'), true, ''); toggleOverlay(true);
    try{
      const body = {
        host: $('#tcpHost').value.trim(),
        port: parseInt($('#tcpPort').value||'0',10)
      };
      const r = await fetch(TCP_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
      const j = await r.json();
      showMsg($('#tcpMsg'), !!j.ok, j.ok ? 'Done' : (j.error||'Failed'));
      $('#tcpOut').value = (j.output||'');
    }catch(e){
      showMsg($('#tcpMsg'), false, 'Unexpected error');
    }finally{ toggleOverlay(false); }
  });
});
</script>
