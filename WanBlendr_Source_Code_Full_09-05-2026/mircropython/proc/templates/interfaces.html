<script>
  let collapsedParents = new Set();
  function parseInterfaceType(ifaceName) {
    let mVlan = ifaceName.match(/^eth(\d+)\.(\d+)$/);
    if (mVlan) return { type: 'eth', index: parseInt(mVlan[1], 10), vlanId: parseInt(mVlan[2], 10), isVlan: true };
    let mEth = ifaceName.match(/^eth(\d+)$/);
    if (mEth) return { type: 'eth', index: parseInt(mEth[1], 10), isVlan: false };
    let mPppoe = ifaceName.match(/^PPPoE-(\d+)$/);
    if (mPppoe) return { type: 'pppoe', index: parseInt(mPppoe[1], 10) };
    let mPptp = ifaceName.match(/^PPtP-(\d+)$/);
    if (mPptp) return { type: 'pptp', index: parseInt(mPptp[1], 10) };
    let mEoip = ifaceName.match(/^EoIP-(\d+)$/);
    if (mEoip) return { type: 'zeoip', index: parseInt(mEoip[1], 10) };
    return { type: 'other' };
  }
  function groupAndSortInterfaces(interfaces) {
    let ethMap = {};
    let pppoeList = [], pptpList = [], zeoipList = [], others = [];
    interfaces.forEach(iface => {
      let parsed = parseInterfaceType(iface.name);
      if (parsed.type === 'eth') {
        let idx = parsed.index;
        if (!ethMap[idx]) ethMap[idx] = { parent: null, vlans: [] };
        if (parsed.isVlan) ethMap[idx].vlans.push(iface);
        else ethMap[idx].parent = iface;
      } else if (parsed.type === 'pppoe') pppoeList.push(iface);
      else if (parsed.type === 'pptp') pptpList.push(iface);
      else if (parsed.type === 'zeoip') zeoipList.push(iface);
      else others.push(iface);
    });
    function parseIndex(name) {
      let m = name.match(/(\d+)$/);
      return m ? parseInt(m[1], 10) : 0;
    }
    pppoeList.sort((a, b) => parseIndex(a.name) - parseIndex(b.name));
    pptpList.sort((a, b) => parseIndex(a.name) - parseIndex(b.name));
    zeoipList.sort((a, b) => parseIndex(a.name) - parseIndex(b.name));
    let ethKeys = Object.keys(ethMap).map(k => parseInt(k, 10)).sort((a, b) => a - b);
    let finalList = [];
    ethKeys.forEach(k => {
      let g = ethMap[k];
      if (g.parent) finalList.push(g.parent);
      g.vlans.sort((a, b) => {
        let mA = a.name.match(/^eth\d+\.(\d+)$/);
        let mB = b.name.match(/^eth\d+\.(\d+)$/);
        let va = mA ? parseInt(mA[1], 10) : 0;
        let vb = mB ? parseInt(mB[1], 10) : 0;
        return va - vb;
      });
      g.vlans.forEach(v => finalList.push(v));
    });
    finalList.push(...pppoeList, ...pptpList, ...zeoipList, ...others);
    return finalList;
  }
  function createInterfaceRow(iface, isVlanChild = false, parentDevice = null) {
    let tr = document.createElement('tr');
    tr.id = 'iface-' + iface.device;
    if (isVlanChild && parentDevice) {
      tr.dataset.parent = parentDevice;
      tr.classList.add('vlan-child');
    } else {
      tr.classList.add('parent-row');
    }
    tr.innerHTML = `
    <td class="name"></td>
    <td class="mac"></td>
    <td class="link-speed"></td>
    <td class="upcount"></td>
    <td class="tx"></td>
    <td class="rx"></td>
    <td class="tx_bytes"></td>
    <td class="rx_bytes"></td>
    <td class="status"></td>
  `;
    const tdName = tr.querySelector('.name');
    const tdMac = tr.querySelector('.mac');
    const tdLink = tr.querySelector('.link-speed');
    const tdUpCount = tr.querySelector('.upcount');
    const tdTx = tr.querySelector('.tx');
    const tdRx = tr.querySelector('.rx');
    const tdTxBytes = tr.querySelector('.tx_bytes');
    const tdRxBytes = tr.querySelector('.rx_bytes');
    const tdStatus = tr.querySelector('.status');
    tdName.textContent = iface.name; tdName.title = iface.name;
    tdMac.textContent = iface.mac || 'N/A'; tdMac.title = tdMac.textContent;
    tdLink.textContent = (iface.link_speed ? iface.link_speed : 'N/A') + '/' + (iface.duplex ? iface.duplex : 'N/A');
    tdLink.title = tdLink.textContent;
    tdUpCount.textContent = (typeof iface.up_count === 'number' ? iface.up_count : (iface.up_count || '0'));
    tdUpCount.title = tdUpCount.textContent;
    tdTx.textContent = iface.tx; tdTx.title = tdTx.textContent;
    tdRx.textContent = iface.rx; tdRx.title = tdRx.textContent;
    tdTxBytes.textContent = iface.tx_bytes; tdTxBytes.title = tdTxBytes.textContent;
    tdRxBytes.textContent = iface.rx_bytes; tdRxBytes.title = tdRxBytes.textContent;
    tdStatus.textContent = iface.status; tdStatus.title = tdStatus.textContent;
    if (iface.status === 'Up+') tr.classList.add('interfaces-up');
    else if (iface.status === 'Down-') tr.classList.add('interfaces-down');
    try {
      if (iface.status === 'Down-' && (/^eth\d+$/.test(iface.name) || /^SFP\+$/.test(iface.name))) {
        tdName.classList.add('blink-red');
      }
    } catch (_) { }
    return tr;
  }
  function toggleChildRows(parentDev) {
    const tbody = document.getElementById('interfaces-body');
    let childRows = tbody.querySelectorAll(`tr[data-parent="${parentDev}"]`);
    childRows.forEach(cr => cr.classList.toggle('hidden-row'));
  }
  async function pollInterfacesData() {
    try {
      const r = await fetch('/api/interfaces', { cache: 'no-store' });
      if (!r.ok) return;
      const text = await r.text();
      let json;
      try { json = JSON.parse(text); } catch (_) { return; }
      if (!json || !Array.isArray(json.interfaces)) return;
      updateVerticalMeters(json.interfaces);
    } catch (_) { }
  }
  document.addEventListener('DOMContentLoaded', () => {
    pollInterfacesData();
    // Staggered scheduling to avoid UI freeze
    let pollingInterfaces = false;
    async function safePollInterfaces() {
      if (pollingInterfaces) return;
      pollingInterfaces = true;
      try { await pollInterfacesData(); }
      catch (_) { }
      finally { pollingInterfaces = false; setTimeout(safePollInterfaces, 1000); }
    }
    setTimeout(safePollInterfaces, 1000);

    loadWbStatus();
    setTimeout(function loopStatus() {
      loadWbStatus().finally(() => setTimeout(loopStatus, 5000));
    }, 2500);
  });
  function _parseMbps(human) {
    try {
      const s = String(human || '').trim();
      if (!s || s.toLowerCase() === 'n/a') return 0;
      const m = s.match(/([0-9]+(?:\.[0-9]+)?)\s*([a-zA-Z]+)\b/);
      if (!m) return 0;
      const n = parseFloat(m[1]);
      const u = m[2].toLowerCase();
      if (u === 'gbps' || u === 'gb/s' || u === 'g' || u === 'gbit/s' || u === 'gbitps') return n * 1000;
      if (u === 'mbps' || u === 'mb/s' || u === 'm' || u === 'mbit/s' || u === 'mbitps') return n;
      if (u === 'kbps' || u === 'kb/s' || u === 'k' || u === 'kbit/s' || u === 'kbitps') return n / 1000;
      if (u === 'bps' || u === 'b/s' || u === 'bit/s' || u === 'bitps') return n / 1000000;
      return n; // default assume Mbps
    } catch (_) { return 0; }
  }
  function _cssVar(name, fallback) {
    try {
      const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return v || fallback;

  function _formatTimeLabel(ts) {
    try {
      const d = new Date(ts);
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      const ss = String(d.getSeconds()).padStart(2, '0');
      return hh + ':' + mm + ':' + ss;
    } catch (_) { return ''; }
  }
  function _niceStep(raw) {
    try {
      if (!isFinite(raw) || raw <= 0) return 1;
      const p = Math.pow(10, Math.floor(Math.log10(raw)));
      const mant = raw / p;
      let stepMant = 1;
      if (mant <= 1) stepMant = 1;
      else if (mant <= 2) stepMant = 2;
      else if (mant <= 5) stepMant = 5;
      else stepMant = 10;
      return stepMant * p;
    } catch (_) { return 1; }
  }

  function _formatBitsPerSecondFromMbps(mbps) {
    const bits = Math.max(0, Number(mbps) || 0) * 1e6; // Mbps -> bit/s
    if (bits >= 1e9) return (bits / 1e9).toFixed(bits >= 1e10 ? 0 : 2) + ' Gb';
    if (bits >= 1e6) return (bits / 1e6).toFixed(bits >= 1e7 ? 0 : 1) + ' Mb';
    if (bits >= 1e3) return (bits / 1e3).toFixed(bits >= 1e4 ? 0 : 0) + ' Kb';
    return bits.toFixed(0) + ' b';
  }
  function _isParentEthOrSfp(displayName) {
    if (!displayName) return false;
    const n = String(displayName);
    if (n.startsWith('eth') && n.indexOf('.') === -1) return true;
    if (n.startsWith('SFP+') && n.indexOf('.') === -1) return true;
    return false;
  }

  function updateVerticalMeters(interfaces) {
    const cont = document.getElementById('if-circles');
    if (!cont) return;
    const parents = [];
    for (let i = 0; i < interfaces.length; i++) {
      const row = interfaces[i];
      if (_isParentEthOrSfp(row && row.name)) parents.push(row);
    }

    // Animation helpers
    const state = (window.__ifVertState = window.__ifVertState || {});
    function tween(start, end, t) { return start + (end - start) * t; }
    function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

    function animateBars(dev, type, fromCount, toCount, colorClass, durationMs) {
      const g = document.getElementById('cirm-bars-' + type + '-' + dev);
      if (!g) return;
      const bars = g.querySelectorAll('.bar');
      const startTs = performance.now();
      function apply(count) {
        for (let i = 0; i < bars.length; i++) {
          const el = bars[i];
          el.classList.remove('filled-green', 'filled-blue', 'filled-yellow', 'filled-red');
          if (i < count) {
            el.classList.add(colorClass);
            el.classList.remove('unfilled');
          } else {
            // Also ensure we remove the target color if it's an empty bar
            el.classList.remove(colorClass);
            el.classList.add('unfilled');
          }
        }
      }
      function step(now) {
        const p = Math.min(1, (now - startTs) / (durationMs || 400));
        const t = easeInOutCubic(p);
        const cur = Math.round(tween(fromCount, toCount, t));
        apply(cur);
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    for (let i = 0; i < parents.length; i++) {
      const row = parents[i];
      const dev = String(row.device || ('d' + i)).replace(/[^a-zA-Z0-9_\-\.]/g, '_');

      // Check if exists
      if (!document.getElementById('circ-wrap-' + dev)) {
        const name = String(row.name || dev);
        const wrap = document.createElement('div');
        wrap.className = 'circle-meter';
        wrap.id = 'circ-wrap-' + dev;

        const BAR_COUNT = 48;
        let barsTx = '';
        let barsRx = '';
        for (let b = 0; b < BAR_COUNT; b++) {
          const angle = (360 / BAR_COUNT) * b;
          // Outer tx bars (start almost at the absolute edge)
          barsTx += '<rect class="bar unfilled" x="49.25" y="0.5" width="1.5" height="8" rx="0.5" ry="0.5" transform="rotate(' + angle + ' 50 50)" />';
          // Inner rx bars (same width, aligned neatly below outer)
          barsRx += '<rect class="bar unfilled" x="49.25" y="9.5" width="1.5" height="8" rx="0.5" ry="0.5" transform="rotate(' + angle + ' 50 50)" />';
        }

        const svg = `
          <div class="cirmeter">
            <svg class="speedo-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
              <g id="cirm-bars-tx-${dev}">${barsTx}</g>
              <g id="cirm-bars-rx-${dev}">${barsRx}</g>
            </svg>
            <div class="cirmeter-txt-col">
              <span class="val val-tx" id="circ-tx-val-${dev}">0</span>
              <span style="height:2px"></span>
              <span class="val val-rx" id="circ-rx-val-${dev}">0</span>
            </div>
          </div>
        `;

        const info = `
        <div class="circle-info">
          <div class="sub-row name">
            <span>Name:</span>
            <span id="circ-name-${dev}">${name}</span>
          </div>
          
          <div class="sub-row">
            <span>MAC:</span>
            <span id="circ-mac-${dev}">--</span>
          </div>
          
          <div class="sub-row">
             <span>Speed:</span>
             <span id="circ-spd-${dev}">--</span>
          </div>

          <div class="sub-row">
             <span>TxBytes:</span>
             <span id="circ-txb-${dev}">0</span>
          </div>
          
          <div class="sub-row">
             <span>RxBytes:</span>
             <span id="circ-rxb-${dev}">0</span>
          </div>
          
          <div class="sub-row" style="margin-top:2px; border-top:1px solid rgba(255,255,255,0.1); padding-top:2px;">
             <span>Status:</span>
             <span id="circ-st-${dev}">--</span>
          </div>
        </div>
      `;

        wrap.innerHTML = svg + info;
        cont.appendChild(wrap);
      }

      // Update Text Data
      const elName = document.getElementById('circ-name-' + dev);
      const elMac = document.getElementById('circ-mac-' + dev);
      const elSpd = document.getElementById('circ-spd-' + dev);
      const elTxV = document.getElementById('circ-tx-val-' + dev);
      const elRxV = document.getElementById('circ-rx-val-' + dev);
      const elTxb = document.getElementById('circ-txb-' + dev);
      const elRxb = document.getElementById('circ-rxb-' + dev);
      const elSt = document.getElementById('circ-st-' + dev);

      if (elName) elName.textContent = row.name || dev;
      if (elMac) elMac.textContent = row.mac || 'N/A';

      if (elSpd) {
        const rawSpd = (row.link_speed || '').split('/')[0].trim();
        elSpd.textContent = rawSpd || 'N/A';
        // Basic speed coloring
        const val = parseFloat(rawSpd);
        if (!isNaN(val)) {
          if (rawSpd.toLowerCase().includes('g') || val >= 1000) elSpd.style.color = '#24b36b';
          else elSpd.style.color = '';
        }
      }

      const fmtTx = _formatBitsPerSecondFromMbps(_parseMbps(row.tx));
      const fmtRx = _formatBitsPerSecondFromMbps(_parseMbps(row.rx));

      // Split into value and unit to fit circle nicely: '1.2 Gbps' -> '1.2G' or so?
      // Let's keep it simple and just use the formatted string since we made font size smaller
      if (elTxV) elTxV.textContent = fmtTx;
      if (elRxV) elRxV.textContent = fmtRx;

      if (elTxb) elTxb.textContent = row.tx_bytes || '0';
      if (elRxb) elRxb.textContent = row.rx_bytes || '0';

      // Status Logic
      const st = (row.status || '').toLowerCase();
      const isUp = st.includes('up');
      if (elSt) {
        elSt.textContent = row.status || 'Down';
        elSt.style.color = isUp ? '#24b36b' : '#d9534f';
      }
      if (elName) {
        elName.classList.remove('blink-red');
        if (!isUp) elName.classList.add('blink-red');
      }

      // Animate Rings
      const MAX_SCALE_MBPS = 1000;
      const txVal = _parseMbps(row.tx);
      const rxVal = _parseMbps(row.rx);

      const txRatio = Math.max(0, Math.min(1, txVal / MAX_SCALE_MBPS));
      const rxRatio = Math.max(0, Math.min(1, rxVal / MAX_SCALE_MBPS));

      const txTarget = Math.round(txRatio * 48); // 48 bars
      const rxTarget = Math.round(rxRatio * 48); // 48 bars

      const s = state[dev] || { tx: 0, rx: 0 };

      // Determine Rx Color
      let rxColorClass = 'filled-green';
      if (rxVal >= 601) rxColorClass = 'filled-red';
      else if (rxVal >= 251) rxColorClass = 'filled-yellow';

      if (elRxV) {
        elRxV.classList.remove('rx-yellow', 'rx-red');
        if (rxVal >= 601) elRxV.classList.add('rx-red');
        else if (rxVal >= 251) elRxV.classList.add('rx-yellow');
      }

      animateBars(dev, 'tx', s.tx, txTarget, 'filled-blue', 450);
      animateBars(dev, 'rx', s.rx, rxTarget, rxColorClass, 450);

      state[dev] = { tx: txTarget, rx: rxTarget };
    }
  }

  let lastWbSig = '';
  async function loadWbStatus() {
    try {
      const r = await fetch('/dashboard/wb/status_detail', { cache: 'no-store' });
      if (!r.ok) return;
      const j = await r.json();

      // Check signature to avoid unnecessary DOM updates
      const sigObj = {
        h: (j.health && j.health.raw) || [],
        e: j.events || [],
        r: (j.health && j.health.rows) || [],
        w: j.status_web || {}
      };
      const sig = JSON.stringify(sigObj);
      if (sig === lastWbSig) return;
      lastWbSig = sig;

      const healthRaw = sigObj.h.join('\n');
      const eventsRaw = sigObj.e.join('\n');
      const rows = sigObj.r;
      const statusWeb = sigObj.w;

      const summary = document.getElementById('wb-summary');
      if (summary) {
        summary.innerHTML = '';
        rows.forEach(row => {
          const pill = document.createElement('div');
          const stWeb = String(statusWeb[row.wan] || '').toLowerCase();
          const ok = (stWeb === 'online') ? true : (stWeb === 'offline' ? false : ((row.status || '').toLowerCase() === 'online'));
          pill.className = 'pill ' + (ok ? 'ok' : 'bad');
          const txtStatus = stWeb ? stWeb : (row.status || '');
          pill.textContent = row.wan + ' — ' + txtStatus + (row.code ? ' (' + row.code + ')' : '');
          summary.appendChild(pill);
        });
      }
      const hEl = document.getElementById('wb-health');
      if (hEl) {
        hEl.style.height = 'auto';
        hEl.textContent = healthRaw || '--';
      }
      const eEl = document.getElementById('wb-events');
      if (eEl) {
        eEl.textContent = eventsRaw || '--';
        if (hEl) eEl.style.height = hEl.offsetHeight + 'px';
      }
    } catch (_) { }
  }
</script>
